# ==============================================================================
# harness.conf — Harness 專案特定配置檔案
# ==============================================================================
# 此檔案由 init.sh / init.ps1 自動載入
# 部署到其他專案時，只需修改此檔案即可
# ==============================================================================

# 專案基本資訊
HARNESS_PROJECT_NAME="AST2700 OpenBMC"
HARNESS_MACHINE="AST2700"
HARNESS_IMAGE="obmc-phosphor-image"
HARNESS_SETUP_CMD=". setup AST2700"

# 必要工件檔案（空格分隔）
HARNESS_REQUIRED_FILES="AGENTS.md feature_list.json claude-progress.md setup BMC_Function_Specification.md"

# 關鍵 meta-layer（空格分隔）
HARNESS_KEY_LAYERS="meta-giga meta-aspeed meta-phosphor meta-openembedded"
